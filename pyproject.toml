[project]
name = "fundamental-matrix"
version = "0.1.0"
description = "General-purpose tool to estimate the fundamental matrix from two images and draw epipolar lines"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "opencv-python>=4.8",
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[tool.uv]
# Single-script layout, so it is not built as a package (virtual project).
# Only the dependencies go into .venv; run fundamental_matrix.py directly with `uv run`.
package = false
